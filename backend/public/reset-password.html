<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>重設密碼</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f5f5f5; color: #222;
  }
  #page { max-width: 400px; margin: 60px auto 0; }
  .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  h1 { font-size: 18px; margin: 0 0 16px; }
  input[type=password] {
    width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 10px;
  }
  button {
    width: 100%; background: #2d7dd2; color: #fff; border: none; border-radius: 8px;
    padding: 12px 16px; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .status { font-size: 13px; margin-top: 12px; }
  .status.ok { color: #1a9c4a; }
  .status.err { color: #d92b2b; }
</style>
</head>
<body>

<div id="page">
  <div class="card">
    <h1>重設密碼</h1>
    <input type="password" id="newPassword" placeholder="新密碼" />
    <input type="password" id="confirmPassword" placeholder="再次輸入新密碼" />
    <button id="btnReset">重設密碼</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
  const token = new URLSearchParams(location.search).get('token');
  const statusEl = document.getElementById('status');

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = `status ${kind || ''}`;
  }

  if (!token) setStatus('連結無效，請重新從忘記密碼流程申請。', 'err');

  document.getElementById('btnReset').addEventListener('click', async () => {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (!token) return;
    if (!newPassword || newPassword.length < 6) return setStatus('密碼至少需要 6 個字元', 'err');
    if (newPassword !== confirmPassword) return setStatus('兩次輸入的密碼不一致', 'err');

    const btn = document.getElementById('btnReset');
    btn.disabled = true;
    setStatus('處理中…', '');
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '重設失敗');
      setStatus('密碼已重設成功，請回到 App 用新密碼登入。', 'ok');
      btn.remove();
    } catch (err) {
      setStatus(err.message, 'err');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
