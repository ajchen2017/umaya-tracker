<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>登山健行定位追蹤</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  /* Ocean-blue fallback so any unpainted gap (browser compositor quirks on very
     wide/high-DPI screens, or RudyMap's coverage edge) reads as sea, not a void. */
  #map { position: absolute; inset: 0; width: 100%; height: 100%; background: #a8d4f0; }

  /* Updated from JS to the topbar's actual rendered height — a long hike name wraps to
     two lines on narrow screens, and the right-side button column (btnStart/btnColor/...)
     below used to assume a fixed single-line height, so it overlapped the wrapped topbar. */
  :root { --topbar-h: 52px; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center;
    padding: 10px 12px; background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0));
    color: #fff; pointer-events: none;
  }
  #topbar * { pointer-events: auto; }
  /* margin-left clears Leaflet's default zoom control (top-left, ~40px wide). Settings and
     the layer toggle used to live here too, but sharing this row with a name long enough to
     wrap broke their own layout (a wrapped flex row re-justifies per line, so a lone second
     item lands back at the start instead of staying pinned right) — they're now both in the
     right-side icon column below instead, which only hikeName's own height affects. */
  #hikeName {
    font-size: 16px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.6);
    margin-left: 44px;
    /* Reserves the right-column icons' width so a wrapped second line can never extend
       under them — the right column can then sit at plain fixed offsets instead of having
       to track hikeName's (variable) height at all. */
    max-width: calc(100% - 44px - 64px);
  }

  /* Leaflet's own zoom control sits at a fixed offset near the true top of the map and does
     NOT grow with the topbar's (variable, name-length-dependent) height — this has to track
     that fixed position, not --topbar-h, or a long/wrapped hike name pulls it away from the
     +/- buttons it's meant to sit directly under. */
  #zoomLevel {
    position: absolute; left: 10px; top: 78px; z-index: 1000;
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 4px; font-size: 17px; font-weight: 700;
    color: #333; box-shadow: 0 1px 4px rgba(0,0,0,.3); pointer-events: none;
  }

  #btnSettings {
    position: absolute; right: 12px; top: 8px; z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
    background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center;
    font-size: 24px; text-decoration: none; cursor: pointer;
  }

  #statusbar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
    background: rgba(255,255,255,.95); padding: 6px 12px;
    box-shadow: 0 -2px 8px rgba(0,0,0,.15);
    font-size: 11px; color: #222;
    display: flex; align-items: stretch; gap: 4px;
  }
  /* flex:0 0 auto (not 1) so this only takes its own content width — the chart
     then sits immediately next to it instead of being pushed to the far edge. */
  #statusbarInfo { flex: 0 0 auto; min-width: 0; max-width: 100%; }
  /* flex-wrap + min-width:0 on the value — a flex item refuses to shrink/wrap below its
     content's natural width by default, so a long value (lat/lng + altitude + accuracy)
     was overflowing past the screen edge instead of wrapping, getting clipped by body's
     own overflow:hidden. */
  #statusbar .row { display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 1px; }
  #statusbar .row > span:last-child { min-width: 0; overflow-wrap: break-word; }
  #statusbar .label { color: #777; }

  /* Live elevation-vs-time strip chart — floats over the left edge of the map
     rather than living in the bottom status bar, and only shows when the
     guardian has explicitly turned it on (default off — most check-ins never
     need it, and it used to eat status-bar space even empty). Split into
     three pieces: a fixed Y-axis gutter (left), the horizontally scrollable
     plot itself (native scrollbar = the "drag back through history" ask),
     and a fixed X-axis caption row below — so the axis labels never scroll
     away with the data, only the plot does. */
  /* bottom is set from JS to sit flush against the status bar's actual (variable)
     height — the bar grows/shrinks with the alert banner and signal legend. */
  #elevationChart {
    display: none; flex-direction: column;
    position: fixed; left: 0; z-index: 900;
    width: 100vw; height: 122px;
    background: rgba(255,255,255,.95); border-radius: 8px 8px 0 0;
    box-shadow: 0 1px 8px rgba(0,0,0,.3); padding: 6px 6px 4px;
  }
  #elevationChart.show { display: flex; }
  #btnElevToggle {
    margin-top: 8px; border: 1px solid #ccc; border-radius: 20px; background: #f2f2f2;
    color: #333; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  #btnElevToggle.active { background: #2d7dd2; color: #fff; border-color: #2d7dd2; }
  #elevationMain { flex: 1 1 auto; display: flex; overflow: hidden; min-height: 0; }
  #elevationAxisY { flex: 0 0 32px; }
  #elevationAxisY svg { display: block; width: 100%; height: 100%; }
  #elevationScroll { flex: 1 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
  #elevationScroll svg { display: block; height: 100%; }
  /* Zoom controls sit inline right after the caption text (定位頻率 …), not floating over
     the plot's top-right corner — that used to crowd against the plot's own content up
     there and look cramped. */
  #elevationAxisX {
    flex: 0 0 auto; font-size: 10px; color: #888; padding-top: 2px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  #elevationZoomControls { display: flex; gap: 3px; flex: 0 0 auto; }
  #elevationZoomControls button {
    width: 16px; height: 16px; font-size: 12px; line-height: 1; padding: 0;
    border: 1px solid #ccc; border-radius: 3px; background: #fff; cursor: pointer;
  }
  #elevationChart .axis-line { stroke: #ddd; stroke-width: 1; }
  #elevationChart .chart-frame { fill: none; stroke: #bbb; stroke-width: 1; }
  #elevationChart .axis-label { font-size: 11px; fill: #888; }
  #elevationChart .axis-tick { font-size: 10px; fill: #888; text-anchor: end; }
  #elevationChart .elevation-line { stroke: #2d7dd2; stroke-width: 2; fill: none; }
  #elevationChart .elev-point { fill: #2d7dd2; cursor: pointer; }
  #elevationChart .elev-point:hover { fill: #16406e; }
  #elevationChart .event-label {
    font-size: 11px; font-weight: 700; fill: #444; text-anchor: middle;
  }
  #elevationChart .event-label.sos { fill: #d92b2b; }
  #elevationChart .event-label.icon { font-size: 15px; }
  #elevationChart .event-label.edge { text-anchor: end; } /* right-edge labels grow leftward, not off-canvas */

  #signalLegend {
    display: none; flex-wrap: wrap; gap: 4px 12px; padding-bottom: 8px; margin-bottom: 6px;
    border-bottom: 1px solid #eee;
  }

  /* Guardian-facing alert level — advisory only, see design proposal. Green
     shows nothing (nothing to say); yellow/orange/red get progressively louder.
     Sits inline in the 警戒狀態 row next to the dot gauge, not its own banner row. */
  #alertMessage { display: none; font-size: 10px; font-weight: 600; }
  #alertMessage.show { display: inline; }
  #alertMessage.yellow { color: #8a6d00; }
  #alertMessage.orange { color: #9a4b00; }
  #alertMessage.red { color: #a30000; }

  #alertInfo { position: relative; display: inline-flex; align-items: center; cursor: default; }
  #alertIcon { font-size: 15px; }
  #alertInfo .tooltip {
    display: none; position: absolute; bottom: 20px; left: 0; z-index: 1001;
    background: #fff; color: #222; border-radius: 8px; padding: 10px 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); font-size: 12px; font-weight: 400;
    line-height: 1.7; width: max-content; max-width: min(300px, 90vw);
  }
  #alertInfo:hover .tooltip, #alertInfo:focus .tooltip { display: block; }
  #signalLegend.visible { display: flex; }
  #signalLegend .item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #444; }
  #signalLegend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  #sosBanner {
    display: none; position: absolute; top: calc(var(--topbar-h) + 6px); left: 50%; transform: translateX(-50%);
    width: 50%; z-index: 1000;
    background: #d92b2b; color: #fff; padding: 8px 12px; border-radius: 8px; border: none;
    font: inherit; font-weight: 700; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    cursor: pointer;
  }
  #sosBanner:hover, #sosBanner:focus { background: #c22323; }
  #sosBanner:active { background: #a91d1d; }

  /* Thick red frame around the whole viewport while SOS is active — impossible to miss
     even if the guardian isn't looking straight at the status bar text. */
  #sosFrame {
    display: none; position: fixed; inset: 0; z-index: 999; pointer-events: none;
    border: 10px solid #d92b2b; box-sizing: border-box;
  }
  #sosFrame.show { display: block; }

  /* Flashing is the alert's primary channel — sound can be silently blocked outright by
     the browser's autoplay policy until the guardian has clicked anywhere on the page, but
     nothing can block a plain color/opacity animation from showing. */
  @media (prefers-reduced-motion: no-preference) {
    #sosBanner.flashing { animation: sosBannerFlash 1s infinite; }
    #sosFrame.flashing { animation: sosFrameFlash 1s infinite; }
  }
  @media (prefers-reduced-motion: reduce) {
    /* Still needs to read as unmistakably "alarmed", just without motion. */
    #sosBanner.flashing { background: #ff2d2d; }
    #sosFrame.flashing { border-color: #ff2d2d; }
  }
  @keyframes sosBannerFlash {
    0%, 100% { background: #d92b2b; }
    50% { background: #ff7a7a; color: #7a0000; }
  }
  @keyframes sosFrameFlash {
    0%, 100% { border-color: #d92b2b; opacity: 1; }
    50% { border-color: #ff7a7a; opacity: 0.5; }
  }

  /* Whole right-side icon column at plain fixed offsets, stacked 52px apart under
     btnSettings — hikeName's max-width above keeps its wrapped text out of this column
     entirely, so none of these need to track the topbar's (variable) height. */
  #btnMapLayer {
    position: absolute; right: 12px; top: 60px; z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%; border: none; overflow: hidden;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  #btnStart {
    position: absolute; right: 12px; top: 112px; z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%; border: none; overflow: hidden;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #btnStart:disabled { opacity: .4; cursor: default; }

  :root { --point-label-size: 10px; }

  .sos-dot {
    width: 100%; height: 100%; border-radius: 50%; background: #d92b2b; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; letter-spacing: -.5px;
    box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.4);
  }

  .waypoint-label {
    background: rgba(45,125,210,.9); border: none; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    font-size: var(--point-label-size); padding: 1px 5px; color: #fff; font-weight: 600;
    white-space: nowrap;
  }
  .waypoint-label::before { display: none; }

  .signal-label-icon { background: none; border: none; }
  .signal-label-text {
    font-size: 11px; font-weight: 700; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff;
  }

  #btnColor {
    position: absolute; right: 12px; top: 164px; z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #btnColor .swatch { width: 24px; height: 24px; border-radius: 50%; }

  #btnClearTrack {
    position: absolute; right: 12px; top: 216px; z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%; border: none; overflow: hidden;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  #btnRefresh {
    position: absolute; right: 12px; top: 268px; z-index: 1000;
    width: 44px; height: 44px; border-radius: 50%; border: none; overflow: hidden;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  #colorPicker {
    display: none; position: absolute; right: 12px; top: 320px; z-index: 1000;
    background: #fff; border-radius: 12px; padding: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  #colorPicker.open { display: grid; }
  #colorPicker button {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  #colorPicker button.selected { border-color: #222; }
</style>
</head>
<body>

<div id="map"></div>
<div id="sosFrame"></div>
<div id="zoomLevel">—</div>

<div id="topbar">
  <div id="hikeName">載入中…</div>
</div>

<a id="btnSettings" title="設定">⚙️</a>

<button id="sosBanner" type="button">🆘 已發出 SOS 標記，請確認登山者狀況（點擊靜音）</button>

<button id="btnMapLayer" title="地圖圖層">🗺️</button>

<button id="btnStart" disabled title="回到目前定位">📍</button>

<button id="btnColor" title="軌跡顏色"><span class="swatch" id="btnColorSwatch"></span></button>
<div id="colorPicker"></div>

<button id="btnClearTrack" title="清除軌跡">🗑️</button>

<button id="btnRefresh" title="立即重新整理資料">🔄</button>

<div id="statusbar">
  <div id="statusbarInfo">
    <div class="row" style="align-items:center;">
      <span class="label">警戒狀態</span>
      <span id="alertInfo" tabindex="0" title="滑鼠移入／點按查看各等級門檻">
        <span id="alertIcon">⚪⚪⚪</span>
        <span class="tooltip" id="alertInfoTooltip"><!-- filled in dynamically from the hike's actual thresholds --></span>
      </span>
      <span id="alertMessage"></span>
    </div>
    <div id="signalLegend"></div>
    <div class="row"><span class="label">行程狀態</span><span id="hikeStatus">—</span></div>
    <div class="row"><span class="label">最後更新</span><span id="lastUpdate">—</span></div>
    <div class="row"><span class="label">目前位置</span><span id="lastPos">—</span></div>
    <div class="row"><span class="label">手機電量</span><span id="lastBattery">—</span></div>
    <button id="btnElevToggle" title="顯示／隱藏高度曲線">📈 動態圖</button>
  </div>
</div>

<div id="elevationChart">
  <div id="elevationMain">
    <div id="elevationAxisY"></div>
    <div id="elevationScroll"></div>
  </div>
  <div id="elevationAxisX">
    <span id="elevationAxisXText"></span>
    <div id="elevationZoomControls">
      <button id="btnElevZoomOut" title="縮小（每格時間跨度變長，可看更久的歷史，最粗到 2 小時一格）">－</button>
      <button id="btnElevZoomIn" title="放大（每格時間跨度變短）">＋</button>
      <button id="btnElevZoomReset" title="重設為預設縮放（每格 1 分鐘）">↺</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/t/assets/config.js"></script>
<script src="/t/assets/app.js"></script>
</body>
</html>
