server {
    listen 80;
    server_name tracker.umaya.tw;

    # mapsforgesrv XYZ tiles (query string ?task=... passes through automatically)
    location /tiles/ {
        proxy_pass http://127.0.0.1:8486/;
        proxy_set_header Host $host;
    }

    # Everything else (API + family web page) is the Node backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After this is in place: sudo certbot --nginx -d tracker.umaya.tw
