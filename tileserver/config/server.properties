# mapsforgesrv server config — bound to localhost only, Nginx reverse-proxies /tiles/ to this.
port=8486
host=127.0.0.1

# Tiles outside RudyMap's Taiwan coverage (ocean, other countries) redirect here
# instead of returning the built-in "no content" placeholder.
outofrange_tms=https://tile.openstreetmap.org/{z}/{x}/{y}.png
