# Task name "hiking" is referenced by the web page as ?task=hiking
# Map source: https://rudymap.tw/ (weekly updated, non-commercial license)
# Relative paths are resolved from the working directory mapsforgesrv is launched from (tileserver/).
mapfiles=maps/MOI_OSM_Taiwan_TOPO_Rudy.map
themefile=theme/MOI_OSM.xml
style=elmt-hiking
demfolder=dem
hillshading-algorithm=simple(0.1,0.666)
appendbuiltinworldmap=false

# Road/area line widths already scale well with zoom; labels didn't, so bump text only.
text-scale=1.4
