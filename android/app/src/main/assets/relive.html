<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D 飛行回放</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #fff; font-family: system-ui, "Noto Sans TC", sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #map { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.75) 40%); display: flex; flex-direction: column; gap: 6px; }
  #controls .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #controls button, #controls select { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px; padding: 6px 10px; font-size: 14px; }
  #controls button.primary { background: #ff6d00; border-color: #ff6d00; font-weight: bold; }
  #seek { flex: 1; min-width: 120px; accent-color: #ff6d00; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 10px; background: #0d1117; font-size: 15px; z-index: 5; text-align: center; padding: 20px; }
  #loading input { color: #fff; }
  body.recording #controls { display: none; }
  #exploreBar, #exploreHint { display: none; }
  body.explore #controls { display: none; }
  body.explore #exploreBar { display: flex; position: absolute; left: 0; right: 0; bottom: 0; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.75) 40%); }
  #exploreBar button, #exploreBar select { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
  #exploreBar .grow { flex: 1; }
  body.explore #exploreHint { display: block; position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(0,0,0,.6);
    color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 12px; white-space: nowrap; pointer-events: none; transition: opacity .6s; }
  #recBadge { display: none; position: absolute; top: 10px; right: 10px; background: #c62828; padding: 4px 10px; border-radius: 12px;
    font-weight: bold; font-size: 13px; z-index: 6; }
  body.recording #recBadge { display: block; }
  .maplibregl-ctrl-attrib { font-size: 10px; }
  #btnBack { margin-left: auto; }
  #btnRecBack { display: none; position: absolute; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 6;
    background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 8px 14px; font-size: 15px; }
  body.recording #btnRecBack { display: block; }
  .dialog { display: none; position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 10; align-items: center; justify-content: center; padding: 16px; }
  .dialog.open { display: flex; }
  .dialog .box { background: #1c2128; border-radius: 12px; padding: 16px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; }
  .dialog h3 { margin: 0; font-size: 17px; }
  .dialog label { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px; }
  .dialog .hint { font-size: 13px; color: #aab; line-height: 1.4; }
  .dialog .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .dialog .actions.col { flex-direction: column; align-items: stretch; }
  .dialog button, .dialog select { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px; padding: 8px 12px; font-size: 15px; }
  .dialog button.primary { background: #ff6d00; border-color: #ff6d00; font-weight: bold; }
</style>
</head>
<body>
<div id="stage"><div id="map"></div><canvas id="overlay"></canvas></div>
<div id="recBadge">● 錄影中</div>
<div id="loading"><div id="loadingText">載入中…</div></div>
<div id="exploreHint">單指拖曳移動・雙指縮放旋轉・雙指上下推改變俯角</div>
<div id="exploreBar">
  <select id="exStyle"><option value="sat" selected>衛星</option><option value="topo">地形圖</option><option value="osm">街道</option></select>
  <button id="exReset">⟲ 重設視角</button>
  <button id="exFly">▶ 飛行回放</button>
  <span class="grow"></span>
  <button id="exBack">↩ 返回</button>
</div>
<div id="controls">
  <div class="row">
    <button id="btnRestart" title="從頭播放">⏮</button>
    <button id="btnPlay" class="primary">▶</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
  </div>
  <div class="row">
    <select id="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select>
    <select id="style"><option value="sat" selected>衛星</option><option value="topo">地形圖</option><option value="osm">街道</option></select>
    <button id="btnRecord">🎬 錄製影片</button>
    <button id="btnBack">↩ 返回</button>
  </div>
</div>
<button id="btnRecBack">↩ 返回</button>
<div id="recDialog" class="dialog"><div class="box">
  <h3>🎬 錄製影片</h3>
  <label>解析度 <select id="recRes"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="2160">4K</option></select></label>
  <label>播放速度 <select id="recSpeed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select></label>
  <div id="recEstimate" class="hint"></div>
  <div class="hint">錄影時會一格一格算圖，手機上花的時間會比影片長度久（4K 更久）。錄影中請保持螢幕開啟、不要切換 App。</div>
  <div class="actions"><button id="recCancel">取消</button><button id="recGo" class="primary">開始錄製</button></div>
</div></div>
<div id="stopDialog" class="dialog"><div class="box">
  <h3>停止錄影？</h3>
  <div class="actions col">
    <button id="stopSave" class="primary">停止並儲存已錄的部分</button>
    <button id="stopDiscard">放棄這段錄影</button>
    <button id="stopResume">繼續錄影</button>
  </div>
</div></div>
<script>
'use strict';
// ---------- data in ----------
const bridge = window.Android || null;
const TERRAIN_URL = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
const STYLES = {
  sat: { tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], maxzoom: 19,
         attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' },
  topo: { tiles: ['https://a.tile.opentopomap.org/{z}/{x}/{y}.png', 'https://b.tile.opentopomap.org/{z}/{x}/{y}.png', 'https://c.tile.opentopomap.org/{z}/{x}/{y}.png'],
          maxzoom: 17, attribution: '© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)' },
  osm: { tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], maxzoom: 19, attribution: '© OpenStreetMap contributors' },
};
const DEADBAND_M = 8;
const EXAG = 1.3;          // terrain exaggeration (also used by the camera-height check)
const MAX_PITCH = 65, MIN_PITCH = 20;
const CLEARANCE_M = 60;    // keep the sight line this far above the rendered terrain
const CAMERA_FOV = 0.6435011087932844; // MapLibre's default vertical field of view (36.87°)

function haversine(a, b) {
  const R = 6371000, toRad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toRad, dLon = (b.lon - a.lon) * toRad;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function bearingDeg(a, b) {
  const toRad = Math.PI / 180;
  const y = Math.sin((b.lon - a.lon) * toRad) * Math.cos(b.lat * toRad);
  const x = Math.cos(a.lat * toRad) * Math.sin(b.lat * toRad) - Math.sin(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.cos((b.lon - a.lon) * toRad);
  return (Math.atan2(y, x) / toRad + 360) % 360;
}

let T = null; // prepared track

function prepare(track) {
  // Downsample to <= 4000 animation points, keeping each segment's ends.
  const segs = (track.segments || []).filter((s) => s.length >= 2);
  const total = segs.reduce((n, s) => n + s.length, 0);
  const step = Math.max(1, Math.ceil(total / 4000));
  const pts = [];      // flat animation points
  const segStarts = []; // index in pts where each segment begins
  for (const s of segs) {
    segStarts.push(pts.length);
    s.forEach((p, i) => { if (i % step === 0 || i === s.length - 1) pts.push(p); });
  }
  // Cumulative distance (not across segment gaps) and ascent/descent with a deadband.
  const cum = new Array(pts.length).fill(0), asc = new Array(pts.length).fill(0);
  let d = 0, up = 0, down = 0, ref = null;
  for (let i = 0; i < pts.length; i++) {
    if (i > 0 && !segStarts.includes(i)) d += haversine(pts[i - 1], pts[i]);
    cum[i] = d;
    const e = pts[i].ele;
    if (e != null) {
      if (ref == null) ref = e;
      else if (e - ref >= DEADBAND_M) { up += e - ref; ref = e; }
      else if (ref - e >= DEADBAND_M) { down += ref - e; ref = e; }
    }
    asc[i] = up;
  }
  // Playback progress follows the hiker's own time, so the on-foot part gets the screen time: each
  // step weighs its duration (long stops capped at 60 s), scaled down when faster than walking
  // (> 2 m/s, i.e. a bus/jeep transfer). Without timestamps: mostly sample count, a bit of distance.
  const n = pts.length;
  const w = new Array(n).fill(0);
  const timed = pts.every((p) => p.t != null);
  for (let i = 1; i < n; i++) {
    if (segStarts.includes(i)) continue;
    const dist = cum[i] - cum[i - 1];
    if (timed) {
      const dt = Math.max(0, (pts[i].t - pts[i - 1].t) / 1000);
      const speed = dt > 0 ? dist / dt : 0;
      w[i] = Math.min(dt, 60) * Math.min(1, Math.max(0.08, 2 / Math.max(speed, 0.01)));
    } else {
      w[i] = 0.8 / Math.max(1, n - 1) + 0.2 * (d > 0 ? dist / d : 0);
    }
  }
  let acc = 0;
  const wsum = w.reduce((a, b) => a + b, 0) || 1;
  const prog = w.map((x) => (acc += x) / wsum);
  const hasEle = pts.some((p) => p.ele != null);
  const hasTime = pts.length > 1 && pts[0].t != null && pts[pts.length - 1].t != null;
  const lats = pts.map((p) => p.lat), lons = pts.map((p) => p.lon);
  const bounds = [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];
  const eles = pts.map((p) => p.ele).filter((e) => e != null);
  // Each waypoint's position along the track = nearest animation point.
  const waypoints = (track.waypoints || []).map((w) => {
    let best = 0, bestD = Infinity;
    for (let i = 0; i < pts.length; i++) { const dd = haversine(w, pts[i]); if (dd < bestD) { bestD = dd; best = i; } }
    return { ...w, s: cum[best], u: prog[best], img: null, shown: false };
  }).sort((a, b) => a.u - b.u);
  return { title: track.title || '軌跡', pts, segStarts, cum, prog, asc, total: d, totalUp: up, totalDown: down, hasEle, hasTime,
    bounds, minEle: eles.length ? Math.min(...eles) : 0, maxEle: eles.length ? Math.max(...eles) : 0, waypoints };
}

function distAtU(u) { // playback progress (0..1) -> distance along the track
  const g = T.prog; let lo = 0, hi = g.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (g[mid] <= u) lo = mid; else hi = mid - 1; }
  if (lo >= g.length - 1) return T.total;
  const f = g[lo + 1] > g[lo] ? (u - g[lo]) / (g[lo + 1] - g[lo]) : 0;
  return T.cum[lo] + f * (T.cum[lo + 1] - T.cum[lo]);
}
function indexAt(s) { // last index with cum <= s
  const c = T.cum; let lo = 0, hi = c.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (c[mid] <= s) lo = mid; else hi = mid - 1; }
  return lo;
}
function pointAt(s) {
  const i = indexAt(s), p = T.pts[i];
  if (i >= T.pts.length - 1) return { ...p, i };
  const q = T.pts[i + 1], span = T.cum[i + 1] - T.cum[i];
  const f = span > 0 ? (s - T.cum[i]) / span : 0;
  return { lat: p.lat + (q.lat - p.lat) * f, lon: p.lon + (q.lon - p.lon) * f,
    ele: p.ele != null && q.ele != null ? p.ele + (q.ele - p.ele) * f : p.ele,
    t: p.t != null && q.t != null ? p.t + (q.t - p.t) * f : p.t, i };
}

// ---------- map ----------
let map = null;
function styleFor(key) {
  const s = STYLES[key];
  return {
    version: 8,
    sources: {
      base: { type: 'raster', tiles: s.tiles, tileSize: 256, maxzoom: s.maxzoom, attribution: s.attribution },
      dem: { type: 'raster-dem', tiles: [TERRAIN_URL], tileSize: 256, maxzoom: 15, encoding: 'terrarium', attribution: 'Terrain: Mapzen/AWS' },
    },
    layers: [
      { id: 'sky', type: 'background', paint: { 'background-color': '#9fc6e6' } },
      { id: 'base', type: 'raster', source: 'base' },
    ],
    terrain: { source: 'dem', exaggeration: EXAG },
  };
}
function lineGeo(upToIndex, tail) {
  const lines = [];
  for (let k = 0; k < T.segStarts.length; k++) {
    const a = T.segStarts[k], b = k + 1 < T.segStarts.length ? T.segStarts[k + 1] : T.pts.length;
    if (upToIndex != null && a > upToIndex) break;
    const end = upToIndex == null ? b : Math.min(b, upToIndex + 1);
    const coords = T.pts.slice(a, end).map((p) => [p.lon, p.lat]);
    if (upToIndex != null && upToIndex < b && tail) coords.push([tail.lon, tail.lat]);
    if (coords.length >= 2) lines.push(coords);
  }
  return { type: 'Feature', geometry: { type: 'MultiLineString', coordinates: lines }, properties: {} };
}
function addTrackLayers() {
  map.addSource('full', { type: 'geojson', data: lineGeo(null) });
  map.addSource('done', { type: 'geojson', data: lineGeo(0, T.pts[0]) });
  map.addSource('head', { type: 'geojson', data: { type: 'Point', coordinates: [T.pts[0].lon, T.pts[0].lat] } });
  map.addSource('wps', { type: 'geojson', data: { type: 'FeatureCollection', features: T.waypoints.map((w) => ({
    type: 'Feature', geometry: { type: 'Point', coordinates: [w.lon, w.lat] }, properties: { photo: w.photo >= 0 ? 1 : 0 } })) } });
  map.addLayer({ id: 'full', type: 'line', source: 'full', layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#ffffff', 'line-opacity': 0.55, 'line-width': 4 } });
  map.addLayer({ id: 'done', type: 'line', source: 'done', layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#ff6d00', 'line-width': 6 } });
  map.addLayer({ id: 'wps', type: 'circle', source: 'wps', paint: { 'circle-radius': 7, 'circle-color': ['case', ['==', ['get', 'photo'], 1], '#2d7dd2', '#e53935'],
    'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'head', type: 'circle', source: 'head', paint: { 'circle-radius': 9, 'circle-color': '#ff6d00', 'circle-stroke-color': '#fff', 'circle-stroke-width': 3 } });
}

// ---------- playback ----------
const state = { u: 0, s: 0, playing: false, phase: 'idle', bearing: 0, pitch: MAX_PITCH, holdUntil: 0, card: null, lastFrame: 0, speed: 1, frame: 0,
  clock: 0, t: 0, camFrom: null, camTo: null };
function baseDurationSec() { return Math.max(30, Math.min(90, 20 + T.total / 1000 * 3)); }
function followZoom() { return T.total < 5000 ? 15.2 : T.total < 40000 ? 14.3 : 13.6; }
function lookAhead() { return Math.max(150, T.total * 0.015); }
// ---------- terrain-aware camera height ----------
// The follow camera sits behind and above the hiker at a fixed pitch; crossing a range, a ridge
// behind the hiker can end up between the camera and the target (or around the camera itself),
// which renders as broken/clipped terrain. Before each frame the terrain along the camera→target
// sight line is sampled from the same DEM tiles the map renders, and the pitch is lowered (camera
// raised, looking down more steeply) just enough to keep CLEARANCE_M above every sample.
const DEM_Z = 12;
const demTiles = new Map(); // "x/y" -> Float32Array(256*256) of meters | 'loading' | 'error'
function loadDem(tx, ty) {
  const key = tx + '/' + ty;
  demTiles.set(key, 'loading');
  fetch(TERRAIN_URL.replace('{z}', DEM_Z).replace('{x}', tx).replace('{y}', ty))
    .then((r) => r.blob()).then(createImageBitmap).then((bmp) => {
      const c = document.createElement('canvas'); c.width = 256; c.height = 256;
      const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(bmp, 0, 0);
      const d = g.getImageData(0, 0, 256, 256).data, a = new Float32Array(65536);
      for (let i = 0; i < 65536; i++) a[i] = d[4 * i] * 256 + d[4 * i + 1] + d[4 * i + 2] / 256 - 32768;
      demTiles.set(key, a);
    }).catch(() => demTiles.set(key, 'error'));
}
function elevAt(lat, lon) { // meters, or null while that tile is still loading
  const n = 2 ** DEM_Z, latR = lat * Math.PI / 180;
  const x = (lon + 180) / 360 * n, y = (1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2 * n;
  const tx = Math.floor(x), ty = Math.floor(y), t = demTiles.get(tx + '/' + ty);
  if (t === undefined) { loadDem(tx, ty); return null; }
  if (!(t instanceof Float32Array)) return null;
  return t[Math.min(255, Math.floor((y - ty) * 256)) * 256 + Math.min(255, Math.floor((x - tx) * 256))];
}
function offsetPoint(p, bearing, meters) {
  const b = bearing * Math.PI / 180;
  return { lat: p.lat + meters * Math.cos(b) / 111320, lon: p.lon + meters * Math.sin(b) / (111320 * Math.cos(p.lat * Math.PI / 180)) };
}
// Highest pitch (<= MAX_PITCH) whose camera→target line clears the terrain; null if the DEM isn't loaded yet.
function safePitch(p, bearing, zoom) {
  const e0 = elevAt(p.lat, p.lon);
  if (e0 == null) return null;
  const heightPx = document.getElementById('map').clientHeight || 720;
  const metersPerPx = 40075016.686 * Math.cos(p.lat * Math.PI / 180) / (512 * 2 ** zoom);
  const camDist = 0.5 / Math.tan(CAMERA_FOV / 2) * heightPx * metersPerPx; // camera→center distance, m
  const back = (bearing + 180) % 360, reach = camDist * Math.sin(MAX_PITCH * Math.PI / 180);
  let cot = 1 / Math.tan(MAX_PITCH * Math.PI / 180); // camera height gained per meter back from the target
  for (let k = 1; k <= 48; k++) {
    const x = reach * k / 48, q = offsetPoint(p, back, x), t = elevAt(q.lat, q.lon);
    if (t != null) cot = Math.max(cot, ((t - e0) * EXAG + CLEARANCE_M) / x);
  }
  return Math.max(MIN_PITCH, Math.atan(1 / cot) * 180 / Math.PI);
}
function updatePitch(p, dt) {
  const target = safePitch(p, state.bearing, followZoom());
  if (target == null) return;
  // Rise fast (a ridge is coming), settle back slowly (no bobbing).
  const rate = target < state.pitch ? 8 : 0.8;
  state.pitch += (target - state.pitch) * (1 - Math.exp(-dt * rate));
}

function lerpAngle(a, b, f) { const d = ((b - a + 540) % 360) - 180; return (a + d * f + 360) % 360; }

// Everything on the camera path runs on one virtual clock advanced by advance(dt): the live view
// feeds it real frame time, the video recorder a fixed 1/FPS per frame — so a recording matches
// playback exactly no matter how slowly the phone renders each frame.
const INTRO_HOLD = 1.5, INTRO_FLY = 3.5, OUTRO_EASE = 4, OUTRO_SPIN = 7, OUTRO_END = 11.5; // seconds
function camOverview(pitch, bearing) {
  const c = map.cameraForBounds(T.bounds, { padding: 60, bearing, pitch });
  return { center: [c.center.lng, c.center.lat], zoom: c.zoom, pitch, bearing };
}
function camFollow(p) { return { center: [p.lon, p.lat], zoom: followZoom(), pitch: state.pitch, bearing: state.bearing }; }
function camNow() { const c = map.getCenter(); return { center: [c.lng, c.lat], zoom: map.getZoom(), pitch: map.getPitch(), bearing: map.getBearing() }; }
function camLerp(a, b, f) {
  const e = f < 0.5 ? 2 * f * f : 1 - (-2 * f + 2) ** 2 / 2; // ease in-out
  return { center: [a.center[0] + (b.center[0] - a.center[0]) * e, a.center[1] + (b.center[1] - a.center[1]) * e],
    zoom: a.zoom + (b.zoom - a.zoom) * e, pitch: a.pitch + (b.pitch - a.pitch) * e, bearing: lerpAngle(a.bearing, b.bearing, e) };
}
function startIntro() {
  state.phase = 'intro'; state.t = 0; state.clock = 0; state.holdUntil = 0; state.u = 0; state.s = 0; state.card = null;
  T.waypoints.forEach((w) => (w.shown = false));
  const p0 = T.pts[0];
  state.bearing = bearingDeg(p0, pointAt(Math.min(T.total, lookAhead())));
  state.pitch = safePitch(p0, state.bearing, followZoom()) ?? MIN_PITCH;
  map.getSource('done').setData(lineGeo(0, p0));
  map.getSource('head').setData({ type: 'Point', coordinates: [p0.lon, p0.lat] });
  seekEl.value = 0;
  state.camFrom = camOverview(40, 0);
  map.jumpTo(state.camFrom);
}

// ---------- overlay (drawn on screen and into the video) ----------
const ovCanvas = document.getElementById('overlay'), ovCtx = ovCanvas.getContext('2d');

function fmtKm(m) { return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(2)} km`; }

    const X = (s) => px + 4 * u + (pw - 8 * u) * s / T.total;
    const Y = (e) => py + ph - 4 * u - (ph - 8 * u) * (e - T.minEle) / (T.maxEle - T.minEle);

      ctx.beginPath(); let started = false, lastX = X(0);

    ctx.fillText(`${Math.round(T.maxEle)} m`, px + 6 * u, py + 3 * u);

// ---------- recording ----------
// Offline, frame by frame: step the virtual clock 1/FPS, wait until that view's tiles are in,
// draw, hand the frame to the H.264 encoder (WebCodecs) and mux it into a regular MP4. Slower than

// the old real-time MediaRecorder lost frames whenever rendering lagged and wrote fragmented MP4s.

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const s = Math.min(innerWidth / REC_CSS_W, innerHeight / REC_CSS_H);
  mapEl.style.width = REC_CSS_W + 'px'; mapEl.style.height = REC_CSS_H + 'px';
  mapEl.style.transformOrigin = '0 0';
  mapEl.style.transform = `translate(${(innerWidth - REC_CSS_W * s) / 2}px, ${(innerHeight - REC_CSS_H * s) / 2}px) scale(${s})`;
}

  ctx.font = `${rec.H / 60}px system-ui, sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.textBaseline = 'bottom';
  ctx.fillText(STYLES[styleEl.value].attribution + ' | Terrain: AWS', 8, rec.H - 4);

  const waypoints = [...xml.getElementsByTagName('wpt')].map((w) => ({ lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'),
    ele: num(w, 'ele'), name: (w.getElementsByTagName('name')[0] || {}).textContent || '航點', photo: -1 }));
  return { title: name.replace(/\.gpx$/i, ''), segments, waypoints };
}
</script>
</body>
